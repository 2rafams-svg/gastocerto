<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#0f0f0f"/>
<title>Gasto Certo</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<link rel="icon" type="image/png" href="icon-192.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- PIN SCREEN -->
<div id="pin-screen" style="display:none">
  <svg class="pin-logo" width="72" height="72" viewBox="0 0 120 120">
    <rect width="120" height="120" rx="28" fill="#1a1a1a"/>
    <circle cx="60" cy="60" r="34" fill="none" stroke="#c8f04a" stroke-width="7"/>
    <path d="M46 61 L56 71 L76 49" fill="none" stroke="#c8f04a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="pin-title">Gasto<span>Certo</span></div>
  <div class="pin-subtitle">Digite seu PIN para entrar</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div>
    <div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div>
    <div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-grid" id="pin-grid">
    <button class="pin-key" data-key="1">1</button>
    <button class="pin-key" data-key="2">2</button>
    <button class="pin-key" data-key="3">3</button>
    <button class="pin-key" data-key="4">4</button>
    <button class="pin-key" data-key="5">5</button>
    <button class="pin-key" data-key="6">6</button>
    <button class="pin-key" data-key="7">7</button>
    <button class="pin-key" data-key="8">8</button>
    <button class="pin-key" data-key="9">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" data-key="0">0</button>
    <button class="pin-key del" data-key="del">⌫</button>
  </div>
  <div class="pin-error-msg" id="pin-error"></div>
</div>

<!-- AUTH -->
<div id="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <svg class="logo-mark" width="34" height="34" viewBox="0 0 120 120"><circle cx="60" cy="60" r="44" fill="none" stroke="#c8f04a" stroke-width="10"/><path d="M42 62 L55 75 L80 46" fill="none" stroke="#c8f04a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div class="auth-title">Gasto<span>Certo</span></div>
    </div>
    <div class="auth-copy" id="auth-copy">Entre para acessar seus gastos com segurança.</div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="auth-login-tab" onclick="setAuthMode('login')">Entrar</button>
      <button class="auth-tab" id="auth-signup-tab" onclick="setAuthMode('signup')">Criar conta</button>
    </div>
    <form id="auth-form">
      <label class="auth-field" id="auth-name-field" hidden><span class="auth-label">Nome (opcional)</span><input class="auth-input" id="auth-name" autocomplete="name" maxlength="80"/></label>
      <label class="auth-field" id="auth-username-field" hidden><span class="auth-label">Nome de usuário</span><input class="auth-input" id="auth-username" autocomplete="off" maxlength="20" placeholder="ex: rafael" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,'')"/><span class="auth-hint" id="auth-username-hint">Como você aparece para outras pessoas. Único e sem espaços.</span></label>
      <label class="auth-field"><span class="auth-label">E-mail</span><input class="auth-input" id="auth-email" type="email" autocomplete="email" required/></label>
      <label class="auth-field"><span class="auth-label">Senha</span><input class="auth-input" id="auth-password" type="password" autocomplete="current-password" minlength="6" required/></label>
      <button class="auth-submit" id="auth-submit" type="submit">Entrar</button>
      <div class="auth-error" id="auth-error"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;flex:1;flex-direction:column;height:100%">
  <div class="header">
    <div class="header-row">
      <div class="title-wrap">
        <svg class="logo-mark" width="26" height="26" viewBox="0 0 120 120">
          <circle cx="60" cy="60" r="44" fill="none" stroke="#c8f04a" stroke-width="10"/>
          <path d="M42 62 L55 75 L80 46" fill="none" stroke="#c8f04a" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="app-title">Gasto<span>Certo</span></div>
      </div>
      <div class="header-right">
        <div class="month-pill" onclick="openMonthPicker()">
          <i class="fa-regular fa-calendar" aria-hidden="true"></i>
          <span id="current-month-label">---</span>
        </div>
        <span class="plan-badge" id="plan-badge" onclick="openAccountModal()">Grátis</span>
        <button class="account-btn" onclick="openAccountModal()" aria-label="Minha conta" id="account-btn"><i class="fa-regular fa-user" aria-hidden="true"></i></button>
      </div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('home',this)">Início</button>
    <button class="tab" onclick="switchTab('categorias',this)">Grupo de despesa</button>
    <button class="tab" onclick="switchTab('historico',this)">Histórico</button>
    <button class="tab" onclick="switchTab('divisao',this)">Divisão de despesas</button>

  </div>
  <div class="content" id="content" style="flex:1;overflow-y:auto">
    <div class="loading"><div class="spinner"></div>Carregando...</div>
  </div>
  <button class="fab" id="fab" onclick="onFab()" style="display:none" aria-label="Adicionar"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModalOverlay(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div id="modal-content"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
